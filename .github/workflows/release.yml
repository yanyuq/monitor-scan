name: 手动打包发布

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建 ${{ matrix.label }} 运行包
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x86_64
            os: windows-latest
            target: windows-x86_64
            python-architecture: x64
          - label: Linux x86_64
            os: ubuntu-latest
            target: linux-x86_64
            python-architecture: x64
          - label: macOS Intel
            os: macos-13
            target: macos-x86_64
            python-architecture: x64
          - label: macOS Apple Silicon
            os: macos-14
            target: macos-arm64
            python-architecture: arm64

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python-architecture }}

      - name: 安装 Linux 图形运行库
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: 运行本地测试
        run: python -m pytest

      - name: 构建运行包
        run: python scripts/build_package.py --target "${{ matrix.target }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: monitor-scan-${{ matrix.target }}
          path: release/*
          if-no-files-found: error

  release:
    name: 创建日期版本 Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 下载全部运行包
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: 创建或更新 Release 并上传运行包
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION="v$(TZ='Asia/Shanghai' date +'%Y%m%d')"
          NOTES_FILE="$(mktemp)"
          cat > "${NOTES_FILE}" <<EOF
          自动打包发布版本：${VERSION}

          包含运行包：
          - Windows x86_64
          - Linux x86_64
          - macOS Intel x86_64
          - macOS Apple Silicon arm64

          说明：同一天重复手动触发时，会覆盖同名运行包。
          EOF

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit "${VERSION}" --title "${VERSION}" --notes-file "${NOTES_FILE}"
          else
            gh release create "${VERSION}" --title "${VERSION}" --notes-file "${NOTES_FILE}"
          fi

          find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' \) -print0 | xargs -0 gh release upload "${VERSION}" --clobber
